<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102a43" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guarda Municipal" />
    <title>Guarda Municipal — Conselheiro Lafaiete MG</title>
    <meta name="description" content="Central operacional de campo da Guarda Municipal de Conselheiro Lafaiete - MG. Funciona offline." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Captura o beforeinstallprompt ANTES do React montar
      // para não perder o evento quando ele dispara muito cedo
      window.__pwaInstallPrompt__ = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt__ = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
